[project]
name = "psytest"
version = "0.4.0"
description = "本地端多模態心理諮商模擬數據生成系統"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "llama-cpp-python>=0.2.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "requests>=2.31.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "pydantic>=2.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
